name: Keep Render App Alive

on:
  schedule:
    # Runs every 14 minutes (Render sleeps after 15 mins of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping:
    name: Ping Render Server
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging https://lifetrace-ai.onrender.com/health ..."
          curl -sS --max-time 60 https://lifetrace-ai.onrender.com/health || echo "Ping finished with non-zero exit"
