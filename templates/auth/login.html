{% extends "base.html" %}

{% block title %}Sign In — LifeTrace AI{% endblock %}

{% block public_content %}
<div style="min-height: 85vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
  <div class="card" style="max-width: 420px; width: 100%; padding: 2.25rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="{{ url_for('auth.index') }}" class="brand-logo" style="justify-content: center; margin-bottom: 0.75rem;">
        <div class="brand-icon">⚡</div>
        <span>LifeTrace AI</span>
      </a>
      <h2 style="font-size: 1.4rem; font-weight: 700;">Welcome Back</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Sign in to access your personal memories and reminders</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="identifier">Username or Email</label>
        <input type="text" id="identifier" name="identifier" class="form-control" placeholder="e.g. rahul or user@example.com" value="{{ identifier or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
        <label class="form-check">
          <input type="checkbox" name="remember" value="1">
          <span>Remember me for 7 days</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
        Sign In
      </button>
    </form>

    <div style="margin: 1.5rem 0; text-align: center; position: relative;">
      <hr style="border: none; border-top: 1px solid var(--border-subtle);">
      <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-card); padding: 0 0.5rem; font-size: 0.75rem; color: var(--text-faint);">OR</span>
    </div>

    <!-- Demo login button -->
    <form action="{{ url_for('auth.dev_demo_login') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-secondary" style="width: 100%; padding: 0.65rem; font-size: 0.88rem; border-color: rgba(99, 102, 241, 0.4);">
        ⚡ Sign in as Demo User (One-Click)
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.85rem; color: var(--text-muted);">
      Don't have an account yet?
      <a href="{{ url_for('auth.register') }}" style="font-weight: 600; margin-left: 0.25rem;">Create Account</a>
    </div>
  </div>
</div>
{% endblock %}
